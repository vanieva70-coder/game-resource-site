<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>数据统计 - 游戏资源站</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    .stats-wrap{max-width:960px;margin:36px auto 20px}
    .stats-head h1{font-size:26px}
    .hint{color:var(--muted);font-size:13.5px;margin:10px 0 22px}
    .hint a,.hint code{color:var(--accent2)}
    .hint code{background:var(--bg-soft);border:1px solid var(--border-soft);padding:1px 7px;border-radius:6px}
    .totals{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:24px}
    .total-card{flex:1;min-width:150px;background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px 18px}
    .total-card .num{font-size:26px;font-weight:700;color:var(--accent2)}
    .total-card .lab{font-size:12.5px;color:var(--dim);margin-top:2px}
    table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden;font-size:13.5px}
    th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--border-soft)}
    th{background:var(--bg-soft);color:var(--muted);font-weight:600;font-size:12.5px}
    tr:last-child td{border-bottom:none}
    td.num{color:var(--accent2);font-variant-numeric:tabular-nums}
    .breakdown{color:var(--dim);font-size:12px;line-height:1.8}
    td a:hover{color:var(--accent)}
    .stats-error{margin-top:30px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:26px;color:var(--muted);line-height:1.9}
    .stats-error a,.stats-error code{color:var(--accent2)}
    .stats-error code{background:var(--bg-soft);border:1px solid var(--border-soft);padding:1px 7px;border-radius:6px}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html"><span>📊 数据统计</span></a>
      <nav class="top-nav"><a href="index.html">← 返回首页</a></nav>
    </div>
  </header>
  <main class="container">
    <div class="stats-wrap">
      <div class="stats-head"><h1>访问统计</h1></div>
      <p class="hint">统计由 Cloudflare Pages Functions + KV 提供。仅部署到 Cloudflare Pages 并绑定 <code>GAME_STATS</code> 命名空间后生效，详见 <a href="README.md">README.md</a>。</p>
      <div id="stats-content">加载中…</div>
    </div>
  </main>
  <footer class="site-footer"><div class="container"><p class="footer-meta">统计数据可能有分钟级延迟</p></div></footer>

  <script>
    'use strict';
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    (async () => {
      const el = document.getElementById('stats-content');

      let games = [];
      try {
        const r = await fetch('data/games.json');
        if (r.ok) games = (await r.json()).games || [];
      } catch (e) {}

      let stats = null;
      try {
        const r = await fetch('/api/stats', { cache: 'no-store' });
        if (r.ok) {
          const j = await r.json();
          if (j && typeof j === 'object' && !Array.isArray(j) && j.ok !== false) stats = j;
        }
      } catch (e) {}

      if (!stats) {
        el.innerHTML = '<div class="stats-error">❌ 统计未启用。<br>可能原因：① 站点未部署到 Cloudflare Pages；② 未创建并绑定 <code>GAME_STATS</code> KV 命名空间；③ 绑定后没有重新部署。<br>绑定 KV 后重新部署一次即可，详细步骤见 <a href="README.md">README.md</a>。</div>';
        return;
      }

      const rows = games
        .map((g) => ({ g, s: stats[g.id] || null }))
        .sort((a, b) => ((b.s && b.s.clicks && b.s.clicks.total) || 0) - ((a.s && a.s.clicks && a.s.clicks.total) || 0));
      const withStats = rows.filter((r) => r.s);
      const totalViews = withStats.reduce((n, r) => n + (r.s.views || 0), 0);
      const totalClicks = withStats.reduce((n, r) => n + ((r.s.clicks && r.s.clicks.total) || 0), 0);

      el.innerHTML = `
        <div class="totals">
          <div class="total-card"><div class="num">${totalClicks}</div><div class="lab">总下载点击</div></div>
          <div class="total-card"><div class="num">${totalViews}</div><div class="lab">总详情浏览</div></div>
          <div class="total-card"><div class="num">${withStats.length}</div><div class="lab">有数据的游戏</div></div>
        </div>
        <table>
          <thead><tr><th>#</th><th>游戏</th><th>浏览量</th><th>下载点击</th><th>分网盘明细</th></tr></thead>
          <tbody>
            ${rows.map((r, i) => {
              const s = r.s;
              const bd = s && s.clicks
                ? Object.entries(s.clicks).filter(([k]) => k !== 'total').map(([k, v]) => `${esc(k)}：${v}`).join('　·　')
                : '';
              return `<tr>
                <td>${i + 1}</td>
                <td><a href="index.html#/game/${encodeURIComponent(r.g.id)}">${esc(r.g.title)}</a></td>
                <td class="num">${s ? s.views || 0 : '—'}</td>
                <td class="num">${s && s.clicks ? s.clicks.total || 0 : '—'}</td>
                <td class="breakdown">${bd || '—'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>`;
    })();
  </script>
</body>
</html>
