<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>游戏资源站</title>
  <meta name="description" content="PC 单机游戏资源站：百度网盘、夸克网盘、阿里云盘等多网盘下载链接，支持搜索与分类筛选。" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#/">
        <svg class="brand-logo" viewBox="0 0 64 64" width="30" height="30" aria-hidden="true">
          <rect x="8" y="20" width="48" height="26" rx="13" fill="none" stroke="#7c5cff" stroke-width="5"/>
          <path d="M18 25v16M10 33h16" stroke="#22d3a6" stroke-width="5" stroke-linecap="round"/>
          <circle cx="42" cy="30" r="3.5" fill="#e9edf6"/>
          <circle cx="50" cy="36" r="3.5" fill="#e9edf6"/>
        </svg>
        <span id="brand-name">游戏资源站</span>
      </a>
      <nav class="top-nav">
        <a href="#/">首页</a>
        <a href="wishlist.html">游戏心愿单</a>
        <a href="stats.html">数据统计</a>
      </nav>
    </div>
  </header>

  <div id="announcement" class="announcement container" hidden></div>

  <main id="main" class="container">
    <section id="list-view">
      <div class="hero">
        <h1 id="site-name">游戏资源站</h1>
        <p id="site-desc">收录 PC 单机游戏，多网盘下载</p>
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="search-input" type="search" placeholder="搜索游戏名称、类型、标签…" autocomplete="off" />
        </div>
        <div id="hero-stats" class="hero-stats"></div>
      </div>

      <div class="filters">
        <div class="filter-row">
          <span class="filter-label">分类</span>
          <div id="category-chips" class="chips"></div>
        </div>
        <div class="filter-row">
          <span class="filter-label">标签</span>
          <div id="tag-chips" class="chips"></div>
        </div>
        <div class="filter-row filter-right">
          <span id="result-count" class="result-count"></span>
          <select id="sort-select" title="排序">
            <option value="new">最新添加</option>
            <option value="name">按名称</option>
          </select>
        </div>
      </div>

      <div id="game-grid" class="game-grid"></div>
      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-icon">🎮</div>
        <p>没有找到匹配的游戏</p>
        <p class="empty-sub">换个关键词或清除筛选试试</p>
      </div>
    </section>

    <section id="detail-view" hidden></section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p id="footer-text">本站资源仅供学习交流，请于下载后 24 小时内删除；喜欢本作请支持正版。</p>
      <p class="footer-meta">本站所有链接均来自互联网，仅供学习交流使用。</p>
    </div>
  </footer>

  <script src="assets/app.js" defer></script>
</body>
</html>
